<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incognito - Sylph</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #1a1a1a, #000);
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    h1 {
      font-size: 4rem;
      color: #f5f5f5;
      margin-bottom: 2rem;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #999, #ccc, #999);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-container {
      position: relative;
      display: flex;
      align-items: center;
      border-radius: 9999px;
      padding: 0.5rem 1rem;
      transition: transform 0.2s ease;
    }

    .search-container::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background: linear-gradient(90deg, #6a0dad, #7b61ff, #ff00cc, #00ffff);
      filter: blur(25px);
      z-index: -2;
      opacity: 0.4;
      transition: filter 0.3s ease, opacity 0.3s ease, background 0.4s ease;
    }

    .search-container::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background: rgba(25, 25, 25, 0.7);
      backdrop-filter: blur(10px);
      z-index: -1;
    }

    .bounce {
      animation: bounce 0.4s ease;
    }

    @keyframes bounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.07); }
      100% { transform: scale(1); }
    }

    input {
      border: none;
      outline: none;
      font-size: 1rem;
      padding: 0.8rem 1rem;
      width: 400px;
      border-radius: 9999px;
      background: transparent;
      color: #eee;
    }

    button {
      border: none;
      outline: none;
      background: #444;
      color: #fff;
      font-weight: 600;
      border-radius: 9999px;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    button:hover {
      background: #666;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 2rem;
      font-size: 0.85rem;
      color: #777;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      input { width: 200px; }
    }
  </style>
</head>
<body>
  <h1>Sylph Incognito</h1>
  <form class="search-container" id="searchForm">
    <input type="text" id="searchInput" placeholder="Search secretly..." />
    <button type="submit" id="searchButton">Search</button>
  </form>

  <footer>You're in Incognito mode. Nothing will be saved.</footer>
</body>
</html>
